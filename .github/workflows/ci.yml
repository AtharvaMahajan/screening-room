name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only checks code.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Integration tests run against real PostgreSQL, as in local development.
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: screening_room
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: screening_room
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U screening_room"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://screening_room:ci-only-password@127.0.0.1:5432/screening_room

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies (fails if uv.lock is out of date)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      # The service database starts empty, so this also proves the full
      # migration history applies from scratch.
      - name: Migrations apply to a fresh database
        run: uv run alembic upgrade head

      - name: Latest migration round-trips (downgrade, then upgrade again)
        run: |
          uv run alembic downgrade -1
          uv run alembic upgrade head

      - name: Models and migrations are in sync
        run: uv run alembic check

      - name: pytest
        run: uv run pytest

  # Fails when the API changed but frontend/src/api/schema.ts wasn't regenerated.
  api-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version

      - name: Install uv
        run: python -m pip install uv

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Export the OpenAPI schema (no database needed)
        working-directory: backend
        run: uv run python -m screening_room.openapi ../frontend/openapi.json

      - name: Generated types are up to date
        working-directory: frontend
        run: npm run api:check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (exactly as locked)
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build
