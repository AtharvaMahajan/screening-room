# Alembic configuration. Run commands from backend/, e.g. `uv run alembic upgrade head`.
# The database URL is NOT set here: alembic/env.py reads DATABASE_URL through the
# app's Settings, so migrations and the app always target the same database.

[alembic]
script_location = %(here)s/alembic
# Sequential, readable file names: create migrations with
#   uv run alembic revision --autogenerate --rev-id 0002 -m "short description"
file_template = %%(rev)s_%%(slug)s
path_separator = os

# Run Ruff on every newly generated migration, so it passes CI without hand edits
# (e.g. the template's unused `op`/`sa` imports are removed when not needed).
[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
