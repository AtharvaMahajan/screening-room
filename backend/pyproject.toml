[project]
name = "screening-room"
version = "0.1.0"
description = "Screening Room API: personalized movie and TV discovery."
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.115",
    # Plain uvicorn, not uvicorn[standard]: the extras (uvloop, httptools, PyYAML
    # log config) aren't needed locally, and PyYAML has no Python 3.15 wheel yet.
    "uvicorn>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    # HTTP client for TMDB (and FastAPI's TestClient): the maintained successor
    # of httpx, with the same API.
    "httpx2>=2.16",
]

[dependency-groups]
dev = [
    "import-linter>=2.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

# --- Module boundaries (ADR-0001), checked by `uv run lint-imports` ------------
# Add each new module (profile, discovery, library) to these lists as it arrives.
[tool.importlinter]
root_package = "screening_room"

[[tool.importlinter.contracts]]
name = "Shared infrastructure (core, db, config) doesn't depend on feature modules"
type = "forbidden"
source_modules = ["screening_room.core", "screening_room.db", "screening_room.config"]
forbidden_modules = ["screening_room.modules"]

[[tool.importlinter.contracts]]
name = "identity depends on no other module (all modules may depend on identity)"
type = "forbidden"
source_modules = ["screening_room.modules.identity"]
forbidden_modules = [
    "screening_room.modules.catalog",
    "screening_room.modules.profile",
    "screening_room.modules.discovery",
    "screening_room.modules.library",
]

[[tool.importlinter.contracts]]
name = "catalog depends on no module except identity (profile, library -> catalog, never back)"
type = "forbidden"
source_modules = ["screening_room.modules.catalog"]
forbidden_modules = [
    "screening_room.modules.profile",
    "screening_room.modules.discovery",
    "screening_room.modules.library",
]

[[tool.importlinter.contracts]]
name = "profile depends only on catalog and identity (discovery -> profile, never back)"
type = "forbidden"
source_modules = ["screening_room.modules.profile"]
forbidden_modules = ["screening_room.modules.discovery", "screening_room.modules.library"]

[[tool.importlinter.contracts]]
name = "library depends only on catalog and identity (discovery -> library, never back)"
type = "forbidden"
source_modules = ["screening_room.modules.library"]
forbidden_modules = ["screening_room.modules.discovery", "screening_room.modules.profile"]

[[tool.importlinter.contracts]]
name = "Modules use identity only through its service, schemas and dependencies"
type = "forbidden"
source_modules = [
    "screening_room.modules.catalog",
    "screening_room.modules.profile",
    "screening_room.modules.discovery",
    "screening_room.modules.library",
]
forbidden_modules = [
    "screening_room.modules.identity.models",
    "screening_room.modules.identity.router",
    "screening_room.modules.identity.csrf",
]
# A public function may use its own module's private parts (dependencies ->
# service -> models), so only DIRECT imports of private parts are forbidden.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Modules use catalog only through its service and schemas"
type = "forbidden"
source_modules = [
    "screening_room.modules.profile",
    "screening_room.modules.discovery",
    "screening_room.modules.library",
]
forbidden_modules = [
    "screening_room.modules.catalog.models",
    "screening_room.modules.catalog.router",
    "screening_room.modules.catalog.read_through",
    "screening_room.modules.catalog.dependencies",
    "screening_room.modules.catalog.ingestion",
    "screening_room.modules.catalog.providers",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Modules use profile only through its service and schemas"
type = "forbidden"
source_modules = ["screening_room.modules.discovery"]
forbidden_modules = [
    "screening_room.modules.profile.models",
    "screening_room.modules.profile.router",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Modules use library only through its service and schemas"
type = "forbidden"
source_modules = ["screening_room.modules.discovery"]
forbidden_modules = [
    "screening_room.modules.library.models",
    "screening_room.modules.library.router",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The recommendation engine uses nothing from the app around it (it's pure)"
type = "forbidden"
source_modules = ["screening_room.modules.discovery.engine"]
forbidden_modules = [
    "screening_room.modules.discovery.retrieval",
    "screening_room.modules.discovery.service",
    "screening_room.modules.discovery.router",
    "screening_room.modules.discovery.models",
    "screening_room.modules.catalog",
    "screening_room.modules.profile",
    "screening_room.modules.library",
    "screening_room.modules.identity",
]

# --- Ruff: lint + format ------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "ASYNC",   # flags blocking calls inside async functions
]

[tool.ruff.lint.isort]
# Our migrations folder is named alembic/, which would otherwise make Ruff treat
# the installed alembic library as first-party code.
known-third-party = ["alembic"]

# --- mypy: strict on application code (project-structure.md §9) --------------
[tool.mypy]
python_version = "3.15"
strict = true
files = ["src", "tests", "alembic", "scripts"]
plugins = ["pydantic.mypy"]

# --- pytest ------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
